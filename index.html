<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WWE Universe Manager</title>
  </head>
  <body>
    <div id="global-error-display" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:white; color:red; z-index:999999; padding:20px; font-family:monospace; overflow:auto;">
      <h1>CRITICAL BROWSER ERROR</h1>
      <pre id="global-error-text" style="white-space:pre-wrap; background:#f5f5f5; color:#333; padding:10px;"></pre>
    </div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById('global-error-display').style.display = 'block';
        document.getElementById('global-error-text').innerText += '\n' + message + ' at ' + source + ':' + lineno + ':' + colno + '\n' + (error && error.stack ? error.stack : '');
      };
      window.onunhandledrejection = function(event) {
        document.getElementById('global-error-display').style.display = 'block';
        document.getElementById('global-error-text').innerText += '\nUnhandled Rejection: ' + (event.reason && event.reason.stack ? event.reason.stack : event.reason);
      };
      
      const originalConsoleError = console.error;
      console.error = function(...args) {
        document.getElementById('global-error-display').style.display = 'block';
        document.getElementById('global-error-text').innerText += '\nConsole Error: ' + args.join(' ');
        originalConsoleError.apply(console, args);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
